[package]
name = "examples"
description = "orr's examples, and the test that runs them headless against blessed frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# orr's `pcl-stats`: hdr-calibration reports PC latency to the NVIDIA overlay and FrameView.
pcl-stats = ["orr/pcl-stats"]

[dependencies]
orr.workspace = true
orr_cook.workspace = true
orr_math.workspace = true
orr_color.workspace = true
orr_shaders.workspace = true
orr_atmosphere.workspace = true
bytemuck.workspace = true
env_logger.workspace = true
log.workspace = true
png.workspace = true
winit = "0.30.13"

[target.'cfg(windows)'.dependencies]
orr_egui.workspace = true
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }

[dev-dependencies]
orr_scene = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[[example]]
name = "gpu-basics"
path = "gpu-basics.rs"

[[example]]
name = "cluster-rt"
path = "cluster-rt.rs"

[[example]]
name = "viewer"
path = "viewer.rs"

[[example]]
name = "hdr-calibration"
path = "hdr-calibration.rs"

[[example]]
name = "dlss"
path = "dlss.rs"

[[example]]
name = "rigid-parts"
path = "rigid-parts.rs"

[[example]]
name = "producer-field"
path = "producer-field.rs"

[[example]]
name = "dielectrics"
path = "dielectrics.rs"

[[example]]
name = "many-lights"
path = "many-lights.rs"

[[example]]
name = "sky"
path = "sky.rs"

[[example]]
name = "dense-vegetation"
path = "dense-vegetation.rs"

[[example]]
name = "streaming-stress"
path = "streaming-stress.rs"

[[example]]
name = "bench"
path = "bench.rs"

[[example]]
name = "quality"
path = "quality.rs"

[[example]]
name = "skinned"
path = "skinned.rs"

[[example]]
name = "tree-viewer"
path = "tree-viewer.rs"

[lints]
workspace = true
