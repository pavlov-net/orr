[[repos]]
repo = "local"
hooks = [
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all --check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --locked -- -D warnings", language = "system", files = '\.(rs|slang)$|Cargo\.(toml|lock)$', pass_filenames = false },
]
