[[repos]]
repo = "local"
hooks = [
    { id = "typos", name = "typos", entry = "typos --force-exclude", language = "system", types = ["text"] },
    { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all --check", language = "system", types = ["rust"], pass_filenames = false },
    { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --locked --features lighting_math/gpu,openpbr_ref/gpu --config 'build.warnings=\"deny\"'", language = "system", files = '\.(rs|slang)$|Cargo\.(toml|lock)$', pass_filenames = false },
]
