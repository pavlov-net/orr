name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Without the DLSS SDK, so this builds the path lint does not.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-8vcpu-windows-2025, blacksmith-6vcpu-macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # groups_match_spectral_color takes minutes on 32 threads, and runners have 6 or 8.
      - name: Run the tests that need no GPU
        run: cargo run --locked -p xtask -- test --no-gpu -- --skip groups_match_spectral_color
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: test-logs-${{ matrix.os }}
          path: target/test-logs

  # What Apple targets build: orr without DLSS. Lint covers the default features.
  no-dlss:
    runs-on: blacksmith-8vcpu-windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check the workspace without DLSS
        run: cargo check --workspace --all-targets --locked --no-default-features
