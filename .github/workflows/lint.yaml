name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prek:
    strategy:
      fail-fast: false
      matrix:
        # Clippy sees different code on each: macOS builds the Metal backend, Windows Vulkan
        # and, with the DLSS SDK, orr_dlss's NGX code.
        os: [blacksmith-8vcpu-windows-2025, blacksmith-6vcpu-macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          dlss: ${{ runner.os == 'Windows' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: prek@0.5.10,typos@1.52.0
      - name: Run the pre-commit hooks
        run: prek run --all-files
