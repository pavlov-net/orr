[package]
name = "pack_suite"
description = "Headless GPU tests of orr_pack's Slang loaders against its CPU readers, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
bytemuck.workspace = true
orr_gpu.workspace = true
orr_pack.workspace = true
orr_scene = { workspace = true, features = ["testing"] }
orr_shaders.workspace = true

[dev-dependencies]
orr_math.workspace = true
gpu_suite.workspace = true
orr_cook = { workspace = true, features = ["gdeflate"] }
png.workspace = true

[[bench]]
name = "page_codec"
harness = false

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
