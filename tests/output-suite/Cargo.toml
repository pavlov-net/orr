[package]
name = "output-suite"
description = "Headless GPU tests of orr-output's passes against the Slang CPU target and CPU models, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr-output = { path = "../../crates/orr-output" }
orr-scene = { workspace = true, features = ["testing"] }
orr-shaders.workspace = true
bytemuck.workspace = true
half = "2.7"

[dev-dependencies]
output-maths = { path = "../output-maths" }

[build-dependencies]
orr-shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
