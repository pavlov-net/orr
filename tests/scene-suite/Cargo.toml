[package]
name = "scene-suite"
description = "GPU tests of orr-scene's tables, uploads and frame skeleton, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr = { workspace = true, features = ["hot-reload"] }
orr-scene = { workspace = true, features = ["testing"] }
orr-gpu.workspace = true
orr-shaders.workspace = true
glam.workspace = true

[dev-dependencies]
bytemuck.workspace = true
orr-color.workspace = true
orr-cook = { path = "../../crates/orr-cook" }
orr-pack.workspace = true
png = "0.18"

[target.'cfg(windows)'.dev-dependencies]
gpu-suite = { path = "../gpu-suite" }
log.workspace = true

[build-dependencies]
orr-shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
