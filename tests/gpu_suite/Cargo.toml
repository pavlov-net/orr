[package]
name = "gpu_suite"
description = "GPU tests of orr_gpu, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Runs the counters target, which needs the Nsight Perf SDK at `NVPERF_SDK_PATH`.
nsight-perf = ["orr_gpu/nsight-perf"]

[dependencies]
orr_gpu.workspace = true
orr_math.workspace = true
orr_shaders.workspace = true
env_logger.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
windows-link.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit.workspace = true

[dev-dependencies]
orr_color.workspace = true
ash.workspace = true
blake3.workspace = true
half = { workspace = true, features = ["bytemuck"] }

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[[test]]
name = "present"
harness = false

[[test]]
name = "counters"
required-features = ["nsight-perf"]

[lints]
workspace = true
