[package]
name = "gpu_suite"
description = "GPU tests of orr_gpu, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr_gpu.workspace = true
orr_shaders.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ash.workspace = true
blake3.workspace = true
glam.workspace = true
half = "2.7"
# GDeflate encoder for the memory decompression test.
gdeflate = "0.4.1"

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
