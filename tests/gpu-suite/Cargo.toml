[package]
name = "gpu-suite"
description = "GPU tests of orr-gpu, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr-gpu.workspace = true
orr-shaders.workspace = true
log.workspace = true
raw-window-handle.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
ash.workspace = true
blake3.workspace = true
glam.workspace = true
half = { version = "2.7", features = ["bytemuck"] }

[build-dependencies]
orr-shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
