[package]
name = "scene_suite"
description = "GPU tests of orr_scene's tables, uploads and frame skeleton, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr = { workspace = true, features = ["hot-reload"] }
orr_scene = { workspace = true, features = ["testing"] }
orr_gpu.workspace = true
orr_shaders.workspace = true
glam.workspace = true

[dev-dependencies]
bytemuck.workspace = true
half.workspace = true
orr_color.workspace = true
orr_math.workspace = true
orr_cook = { path = "../../crates/orr_cook" }
orr_pack.workspace = true
png = "0.18"

[target.'cfg(windows)'.dev-dependencies]
gpu_suite = { path = "../gpu_suite" }
log.workspace = true

[[bench]]
name = "synthetic_forest"
harness = false

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
