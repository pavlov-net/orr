[package]
name = "atmosphere_suite"
description = "Headless GPU tests of orr_atmosphere's LUT passes and linked sky against its f64 reference, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr.workspace = true
orr_atmosphere.workspace = true
orr_lighting.workspace = true
orr_scene = { workspace = true, features = ["testing"] }
orr_shaders.workspace = true
orr_math.workspace = true

[dev-dependencies]
orr_color.workspace = true
lighting_suite.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
