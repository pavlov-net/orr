[package]
name = "openpbr_ref"
description = "The OpenPBR reference BSDF: adobe/openpbr-bsdf's C++ build, orr_lighting.openpbr through Slang's C++ target and, with feature gpu, on the GPU, with the harness that checks a BSDF against them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# `SlangGpu`, the GPU suite, `openpbr-report --gpu` and `openpbr-bench`; need a Vulkan device.
gpu = ["dep:orr_gpu", "dep:orr_lighting", "dep:env_logger"]

[dependencies]
orr_shaders.workspace = true
orr_gpu = { workspace = true, optional = true }
orr_lighting = { workspace = true, optional = true }
env_logger = { workspace = true, optional = true }
shader_math.workspace = true
orr_math.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }
cc.workspace = true

[[test]]
name = "gpu"
required-features = ["gpu"]

[[bin]]
name = "openpbr-bench"
required-features = ["gpu"]

[lints]
workspace = true
