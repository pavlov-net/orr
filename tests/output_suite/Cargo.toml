[package]
name = "output_suite"
description = "Headless GPU tests of orr_output's passes against the Slang CPU target and CPU models, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
orr_output = { path = "../../crates/orr_output" }
orr_scene = { workspace = true, features = ["testing"] }
orr_shaders.workspace = true
bytemuck.workspace = true
half = "2.7"

[dev-dependencies]
orr.workspace = true
output_math = { path = "../output_math" }
orr_egui = { path = "../../crates/orr_egui" }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
egui_demo_lib = "0.37"
log.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gpu_suite = { path = "../gpu_suite" }

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
