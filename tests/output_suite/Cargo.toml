[package]
name = "output_suite"
description = "Headless GPU tests of orr_output's passes against the Slang CPU target and CPU models, run with the validation layer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = ["dlss"]
# Frame generation's tests.
dlss = ["orr_output/dlss", "orr/dlss"]

[dependencies]
log.workspace = true
orr_color.workspace = true
orr_math.workspace = true
orr_output.workspace = true
orr_scene = { workspace = true, features = ["testing"] }
orr_shaders.workspace = true
bytemuck.workspace = true
half.workspace = true

[dev-dependencies]
orr.workspace = true
output_math = { path = "../output_math" }
orr_egui = { path = "../../crates/orr_egui" }
egui = { workspace = true, features = ["monochrome_emoji_fonts"] }
egui_demo_lib = "0.37"

[target.'cfg(windows)'.dev-dependencies]
gpu_suite.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_Threading",
] }

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[[test]]
name = "watch_at_exit"
harness = false

[lints]
workspace = true
