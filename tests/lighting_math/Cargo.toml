[package]
name = "lighting_math"
description = "orr_lighting's real-time OpenPBR BSDF on the CPU and, with feature gpu, on the GPU, checked against adobe/openpbr-bsdf through the OpenPBR harness."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# `RealTimeGpu` and the GPU suite; need a Vulkan device.
gpu = ["dep:orr_gpu", "dep:orr_lighting", "openpbr_ref/gpu"]

[dependencies]
openpbr_ref.workspace = true
shader_math.workspace = true
orr_math.workspace = true
orr_shaders.workspace = true
orr_gpu = { workspace = true, optional = true }
orr_lighting = { workspace = true, optional = true }

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[[test]]
name = "gpu"
required-features = ["gpu"]

[lints]
workspace = true
