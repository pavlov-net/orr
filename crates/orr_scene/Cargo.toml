[package]
name = "orr_scene"
description = "Scenes for orr: GPU scene tables, per-frame uploads, views and the frame skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
links = "orr_scene"

[features]
# `orr_scene::testing`: headless device, readback and reference-image comparison.
testing = ["dep:image", "dep:nv-flip"]
# Recompiles kernels whose sources change and swaps their pipelines at step 1, for dev builds.
hot-reload = ["orr_shaders/hot-reload"]
# Switches only the test suite turns: holding back the binds that finish tile moves, and
# failing the scratch allocations of tile moves.
test-hooks = []

[dependencies]
orr_color.workspace = true
orr_gpu.workspace = true
orr_io.workspace = true
orr_pack.workspace = true
orr_shaders.workspace = true
bytemuck.workspace = true
orr_math.workspace = true
half = { workspace = true, features = ["bytemuck"] }
rustc-hash.workspace = true
thiserror.workspace = true
image = { workspace = true, features = ["png", "exr"], optional = true }
nv-flip = { version = "0.1.2", optional = true }
log.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
