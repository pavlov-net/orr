[package]
name = "orr_shaders"
description = "Slang shaders for orr: GPU ABI types, compiled shader modules and the build-script compiler driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
openpbr = []
build = ["dep:orr_color", "dep:thiserror", "dep:libloading", "dep:serde", "dep:serde_json", "dep:blake3", "dep:bindgen", "dep:cc", "dep:jobserver"]
# `Watcher`: recompiles compiled-in modules from source at run time, for dev builds.
hot-reload = ["build"]

[dependencies]
bytemuck.workspace = true
orr_color = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
cc = { workspace = true, optional = true }
jobserver = { version = "0.1.35", optional = true }

[build-dependencies]
bindgen = { workspace = true, optional = true }

[[test]]
name = "build"
required-features = ["build"]

[lints]
workspace = true
