[package]
name = "orr_output"
description = "Display output for orr: exposure, tonemapping, display targets and presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_output"

[features]
default = ["dlss", "metalfx"]
# Ray reconstruction and frame generation through NVIDIA NGX. On Apple targets, which have no
# Vulkan, it does nothing.
dlss = ["dep:orr_dlss"]
# `dlss` with NGX's development DLLs, which draw the DLSS debug overlay.
dlss-debug-overlay = ["dlss", "orr_dlss/debug-overlay"]
# Ray reconstruction, upscaling and frame interpolation through MetalFX. Off Apple targets it
# does nothing.
metalfx = ["dep:orr_metalfx"]
# Sends every Reflex marker as a PCL Stats event too and marks the PC latency ping that
# `DisplayWatch` receives, for the NVIDIA overlay and FrameView. Windows only.
pcl-stats = ["dep:cc"]

[dependencies]
orr_math.workspace = true
orr_color.workspace = true
orr_scene.workspace = true
orr_shaders.workspace = true
orr_window.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
log.workspace = true
png.workspace = true
exr = { version = "1.74", default-features = false }
moxcms = "0.9"

[build-dependencies]
orr_color.workspace = true
cc = { workspace = true, optional = true }
orr_shaders = { workspace = true, features = ["build"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
orr_dlss = { workspace = true, optional = true }

[target.'cfg(target_vendor = "apple")'.dependencies]
orr_metalfx = { workspace = true, optional = true }

[lints]
workspace = true
