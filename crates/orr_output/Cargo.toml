[package]
name = "orr_output"
description = "Display output for orr: exposure, tonemapping, display targets and presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_output"

[features]
default = ["dlss"]
# Ray reconstruction and frame generation through NVIDIA NGX. On Apple targets, which have no
# Vulkan, it does nothing.
dlss = ["dep:orr_dlss"]
# Sends every Reflex marker as a PCL Stats event too and marks the PC latency ping that
# `DisplayWatch` receives, for the NVIDIA overlay and FrameView. Windows only; builds
# pclstats.h from the Reflex SDK at `REFLEX_SDK`.
pcl-stats = ["dep:cc"]

[dependencies]
orr_math.workspace = true
orr_color.workspace = true
orr_scene.workspace = true
orr_shaders.workspace = true
orr_window.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
log.workspace = true
png.workspace = true
exr = { version = "1.74", default-features = false }
moxcms = "0.8"

[build-dependencies]
cc = { workspace = true, optional = true }
orr_shaders = { workspace = true, features = ["build"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
orr_dlss = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Wdk_Graphics_Direct3D",
] }

[lints]
workspace = true
