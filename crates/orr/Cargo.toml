[package]
name = "orr"
description = "A ray-tracing-first, deferred renderer: scenes, the frame and its fixed order."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
links = "orr"

[features]
# Recompiles kernels whose sources change and swaps their pipelines at step 1, for dev builds.
hot-reload = ["orr_scene/hot-reload"]

[dependencies]
orr_scene.workspace = true
orr_lighting.workspace = true
orr_output = { path = "../orr_output" }
thiserror.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
