[package]
name = "orr"
description = "A ray-tracing-first, deferred renderer: scenes, the frame and its fixed order."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
links = "orr"

[features]
# Recompiles kernels whose sources change and swaps their pipelines at step 1, for dev builds.
hot-reload = ["orr-scene/hot-reload"]

[dependencies]
orr-scene.workspace = true
orr-lighting.workspace = true
orr-output = { path = "../orr-output" }
thiserror.workspace = true

[dev-dependencies]
orr-scene = { workspace = true, features = ["testing"] }
orr-egui = { path = "../orr-egui" }
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
log.workspace = true

[target.'cfg(windows)'.dev-dependencies]
gpu-suite = { path = "../../tests/gpu-suite" }

[lints]
workspace = true
