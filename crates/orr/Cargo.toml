[package]
name = "orr"
description = "A ray-tracing-first, deferred renderer: scenes, the frame and its fixed order."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
links = "orr"

[features]
default = ["dlss"]
# orr_output's `dlss`: DLSS ray reconstruction and frame generation where the target has Vulkan.
dlss = ["orr_output/dlss"]
# Recompiles kernels whose sources change and swaps their pipelines at step 1, for dev builds.
hot-reload = ["orr_scene/hot-reload"]
# PCL Stats for every display (orr_output's `pcl-stats`; needs the Reflex SDK at `REFLEX_SDK`).
pcl-stats = ["orr_output/pcl-stats"]

[dependencies]
orr_scene.workspace = true
orr_lighting.workspace = true
orr_output.workspace = true
orr_math.workspace = true
thiserror.workspace = true
log.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
