[package]
name = "orr_gpu"
description = "Pointer-based GPU interface for orr: GPU memory, a texture heap, root pointers, stage barriers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_gpu"

[dependencies]
orr_shaders.workspace = true
orr_memory.workspace = true
raw-window-handle.workspace = true
bitflags.workspace = true
blake3.workspace = true
bytemuck.workspace = true
log.workspace = true
thiserror.workspace = true

# The Vulkan backend; Apple targets have none.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash.workspace = true
libloading.workspace = true

# The Metal 4 backend.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-metal.workspace = true
objc2-quartz-core.workspace = true
objc2-core-graphics.workspace = true
objc2-core-foundation.workspace = true
raw-window-metal.workspace = true
block2.workspace = true
dispatch2.workspace = true

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }
bindgen.workspace = true

[lints]
workspace = true
