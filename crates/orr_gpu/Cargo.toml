[package]
name = "orr_gpu"
description = "Pointer-based GPU interface for orr: GPU memory, a texture heap, root pointers, stage barriers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_gpu"

[dependencies]
orr_shaders.workspace = true
raw-window-handle.workspace = true
bitflags.workspace = true
blake3.workspace = true
bytemuck.workspace = true
log.workspace = true
thiserror.workspace = true

# The Vulkan backend; Apple targets have none.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
orr_memory.workspace = true
ash.workspace = true
libloading.workspace = true

# The Metal 4 backend.
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3.2"
block2 = "0.6"
dispatch2 = "0.3"

[build-dependencies]
orr_shaders = { workspace = true, features = ["build"] }
bindgen.workspace = true

[lints]
workspace = true
