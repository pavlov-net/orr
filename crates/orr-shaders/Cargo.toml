[package]
name = "orr-shaders"
description = "Slang shaders for orr: GPU ABI types, compiled shader modules and the build-script compiler driver."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
openpbr = []
build = ["dep:thiserror", "dep:libloading", "dep:serde", "dep:serde_json", "dep:blake3", "dep:bindgen", "dep:cc"]
# `Watcher`: recompiles compiled-in modules from source at run time, for dev builds.
hot-reload = ["build"]

[dependencies]
bytemuck.workspace = true
thiserror = { workspace = true, optional = true }
libloading = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
blake3 = { workspace = true, optional = true }
cc = { version = "1.2", optional = true }

[build-dependencies]
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"], optional = true }

[[test]]
name = "build"
required-features = ["build"]

[lints]
workspace = true
