[package]
name = "orr_cook"
description = "Asset cook for orr: importers, processing and the archive tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orr_color = { workspace = true, features = ["serde"] }
orr_io.workspace = true
orr_pack.workspace = true
base64 = "0.22"
bcdec_rs = "=0.2.1"
blake3.workspace = true
bytemuck.workspace = true
# Exact pin: 0.6.1 removed a public re-export in a patch release. Default features pull
# encoders the cook does not use.
ctt = { version = "=0.6.1", default-features = false, features = ["encoder-amd", "encoder-bc7enc", "encoder-intel", "ispc-prebuilt", "rayon"] }
exr = { version = "1.74", default-features = false }
libloading = { workspace = true, optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength", "KHR_materials_ior"] }
half.workspace = true
rustc-hash.workspace = true
image = { workspace = true, features = ["png", "jpeg", "webp", "hdr", "exr"] }
ktx2 = "=0.5.0"
meshopt.workspace = true
# The binary's global allocator: it keeps freed pages, where the Windows heap returns large
# buffers and faults them in again on the next job. Exact pin: it builds its C sources.
mimalloc = { version = "=0.1.52", default-features = false }
moxcms = "0.9"
# Exact pin: no stable API before 1.0, and its composition shapes cooked meshes.
openusd = "=0.8.0"
orr_math.workspace = true
percent-encoding = "2.3"
png.workspace = true
roxmltree = "0.21"
rayon = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tiff = "0.11"
vdb-rs = "0.6"
toml = "0.9"
# Exact pins: the bundled client speaks the protocol of Tracy 0.14.1 and only its tools.
tracy-client = { version = "=0.19.0", optional = true }
tracy-client-sys = { version = "=0.30.1", optional = true }
zstd.workspace = true

[features]
# CPU zones, plots and thread names for the Tracy profiler.
tracy = ["dep:tracy-client", "dep:tracy-client-sys"]
# Neural texture sets through RTXNTC's LibNTC (NVIDIA RTX SDK license, never vendored): the
# headers of the checkout at ORR_NTC_SDK at build time, the library loaded when a set cooks.
ntc = ["dep:libloading", "dep:cc", "dep:orr_shaders"]
# Subdivision cages through OpenSubdiv's Far (Apache-2.0, never vendored): the release
# checkout at ORR_OPENSUBDIV is compiled into the cook.
subd = ["dep:cc", "dep:orr_shaders"]
# GDeflate payload blobs through NVIDIA's libdeflate fork (`gdeflate` branch; MIT and
# Apache-2.0, never vendored), compiled from the checkout at ORR_GDEFLATE.
gdeflate = ["dep:cc", "dep:orr_shaders"]

[build-dependencies]
cc = { workspace = true, optional = true }
orr_shaders = { workspace = true, features = ["build"], optional = true }

[lints]
workspace = true
