[package]
name = "orr-cook"
description = "Asset cook for orr: importers, processing and the archive tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orr-io.workspace = true
orr-pack.workspace = true
base64 = "0.22"
bcdec_rs = "=0.2.1"
blake3.workspace = true
bytemuck.workspace = true
# Exact pin: 0.6.1 removed a public re-export in a patch release. Default features pull
# encoders the cook does not use.
ctt = { version = "=0.6.1", default-features = false, features = ["encoder-bc7enc", "encoder-intel", "ispc-prebuilt", "rayon"] }
glam = { workspace = true, features = ["serde"] }
libloading = { workspace = true, optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength", "KHR_materials_ior"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
meshopt = "=0.7.0"
# Exact pin: no stable API before 1.0, and its composition shapes cooked meshes.
openusd = "=0.8.0"
orr-math.workspace = true
png = "0.18"
roxmltree = "0.21"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
tiff = "0.11"
toml = "0.9"
zstd.workspace = true

[features]
# Neural texture sets through RTXNTC's LibNTC (NVIDIA RTX SDK licence, never vendored): the
# headers of the checkout at ORR_NTC_SDK at build time, the library loaded when a set cooks.
ntc = ["dep:libloading", "dep:cc", "dep:orr-shaders"]
# Subdivision cages through OpenSubdiv's Far (Apache-2.0, never vendored): the release
# checkout at ORR_OPENSUBDIV is compiled into the cook.
subd = ["dep:cc", "dep:orr-shaders"]

[build-dependencies]
cc = { workspace = true, optional = true }
orr-shaders = { workspace = true, features = ["build"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_SystemInformation"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
