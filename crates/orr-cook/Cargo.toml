[package]
name = "orr-cook"
description = "Asset cook for orr: importers, processing and the archive tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
orr-pack.workspace = true
base64 = "0.22"
bcdec_rs = "=0.2.1"
blake3.workspace = true
bytemuck.workspace = true
# Exact pin: 0.6.1 removed a public re-export in a patch release. Default features pull
# encoders the cook does not use.
ctt = { version = "=0.6.1", default-features = false, features = ["encoder-bc7enc", "encoder-intel", "ispc-prebuilt", "rayon"] }
glam.workspace = true
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names", "extras", "KHR_materials_emissive_strength", "KHR_materials_ior"] }
half = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
meshopt = "=0.7.0"
png = "0.18"
rayon = "1"
thiserror.workspace = true

[lints]
workspace = true
