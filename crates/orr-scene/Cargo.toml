[package]
name = "orr-scene"
description = "Scenes for orr: GPU scene tables, per-frame uploads, views and the frame skeleton."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
links = "orr_scene"

[features]
# `orr_scene::testing`: headless device, readback and reference-image comparison.
testing = ["dep:image", "dep:nv-flip", "dep:log"]
# Recompiles kernels whose sources change and swaps their pipelines at step 1, for dev builds.
hot-reload = ["orr-shaders/hot-reload", "dep:log"]

[dependencies]
orr-gpu.workspace = true
orr-pack.workspace = true
orr-shaders.workspace = true
bytemuck.workspace = true
glam.workspace = true
half = "2.7"
thiserror.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "exr"], optional = true }
nv-flip = { version = "0.1.2", optional = true }
log = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[build-dependencies]
orr-shaders = { workspace = true, features = ["build"] }

[lints]
workspace = true
