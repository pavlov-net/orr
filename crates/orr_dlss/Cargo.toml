[package]
name = "orr_dlss"
description = "DLSS ray reconstruction, super resolution, DLAA and frame generation through NVIDIA NGX on Vulkan."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_dlss"

[features]
# No SDK: features report unsupported, and ray reconstruction copies color to the output
# with a bilinear upscale.
mock = []
# NGX development DLLs, which draw the DLSS debug overlay.
debug_overlay = []

# The crate is empty on Apple targets, where orr_gpu has no Vulkan backend.
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ash.workspace = true
orr_gpu.workspace = true
log.workspace = true
thiserror.workspace = true
uuid = { version = "1", default-features = false }

[build-dependencies]
bindgen.workspace = true

[target.'cfg(not(target_vendor = "apple"))'.dev-dependencies]
half.workspace = true

[lints]
workspace = true
