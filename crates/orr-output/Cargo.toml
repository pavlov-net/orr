[package]
name = "orr-output"
description = "Display output for orr: exposure, tonemapping, display targets and presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_output"

[features]
# Sends every Reflex marker as a PCL Stats event too and marks the PC latency ping that
# `DisplayWatch` receives, for the NVIDIA overlay and FrameView. Windows only; builds
# pclstats.h from the Reflex SDK at `REFLEX_SDK`.
pcl-stats = ["dep:cc"]

[dependencies]
orr-dlss.workspace = true
orr-math.workspace = true
orr-scene.workspace = true
orr-shaders.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
log.workspace = true
png = "0.18"
exr = { version = "1.74", default-features = false }
moxcms = "0.8"

[build-dependencies]
cc = { workspace = true, optional = true }
orr-color.workspace = true
orr-shaders = { workspace = true, features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Display",
  "System",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Wdk_Graphics_Direct3D",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true
