[package]
name = "orr-output"
description = "Display output for orr: exposure, tonemapping, display targets and presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
links = "orr_output"

[dependencies]
orr-scene.workspace = true
orr-shaders.workspace = true
raw-window-handle.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
log.workspace = true
png = "0.18"
exr = { version = "1.74", default-features = false }
moxcms = "0.8"

[build-dependencies]
orr-color.workspace = true
orr-shaders = { workspace = true, features = ["build"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Foundation",
  "Graphics_Display",
  "System",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Win32_System_LibraryLoader"] }

[lints]
workspace = true
