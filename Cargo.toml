[workspace]
members = ["crates/*", "tests/*", "examples", "xtask"]
default-members = ["crates/*", "tests/*", "examples"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pavlov-net/orr"

[workspace.dependencies]
# Default features off, so a member that doesn't name `dlss` doesn't turn it back on under
# `--no-default-features`.
orr = { path = "crates/orr", default-features = false }
orr_atmosphere = { path = "crates/orr_atmosphere" }
orr_color = { path = "crates/orr_color", version = "0.0.1" }
orr_cook = { path = "crates/orr_cook" }
orr_dlss = { path = "crates/orr_dlss", version = "0.0.1" }
orr_egui = { path = "crates/orr_egui" }
orr_gpu = { path = "crates/orr_gpu" }
orr_io = { path = "crates/orr_io", version = "0.0.1" }
orr_lighting = { path = "crates/orr_lighting" }
orr_math = { path = "crates/orr_math", version = "0.0.1" }
orr_output = { path = "crates/orr_output", default-features = false }
orr_memory = { path = "crates/orr_memory", version = "0.0.1" }
orr_pack = { path = "crates/orr_pack" }
orr_scene = { path = "crates/orr_scene" }
orr_shaders = { path = "crates/orr_shaders" }
orr_window = { path = "crates/orr_window" }
lighting_suite = { path = "tests/lighting_suite" }
gpu_suite = { path = "tests/gpu_suite" }
openpbr_ref = { path = "tests/openpbr_ref" }
shader_math = { path = "tests/shader_math" }
# crates.io ash is stuck on Vulkan 1.3.281; master carries 1.4 headers
# with descriptor heap, cluster acceleration structures and cooperative
# vectors.
ash = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
raw-window-handle = "0.6"
thiserror = "2"
log = "0.4"
env_logger = { version = "0.11.11", default-features = false }
glam = { version = "0.34", default-features = false, features = ["std", "f64", "i32", "i64", "u32"] }
blake3 = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
# 0.14 is the version ctt uses, so one zstd-sys builds.
zstd = "0.14"
half = "2.7"
image = { version = "0.25", default-features = false }
serde = "1"
meshopt = "=0.7.0"
rustc-hash = "2.1.3"
png = "0.18"
serde_json = "1.0.154"
egui = { version = "0.37", default-features = false }
io-uring = "0.7.15"
libc = "0.2"
# bindgen's generated dynamic loader calls this version's `Library::new`.
libloading = "0.9"
windows-core = { version = "0.100.0", default-features = false, features = ["std"] }
windows-future = "0.100.0"
windows-link = "0.100.0"
windows-result = "0.100.0"
vulkan-memory-allocator-sys = "0.2.0"
# Metal
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
raw-window-metal = "1.1.0"
block2 = "0.6.2"
dispatch2 = "0.3.1"

cc = "1.10"
bindgen = { version = "0.73.2", default-features = false, features = ["runtime"] }
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
cast_lossless = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
match_same_arms = "warn"
redundant_else = "warn"
unwrap_or_default = "warn"
nonstandard_macro_braces = "warn"
lossy_float_literal = "warn"
if_let_mutex = "deny"
or_fun_call = "warn"
large_enum_variant = "warn"
redundant_clone = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 3

# Tests evaluate subdivision limit surfaces at every generated vertex.
[profile.dev.package.orr_pack]
opt-level = 3

# Examples and tests cook content in process.
[profile.dev.package.orr_cook]
opt-level = 3

# The spectral reference integrator runs in tests.
[profile.dev.package.orr_atmosphere]
opt-level = 3

# The OpenPBR harness samples millions of directions in tests.
[profile.dev.package.openpbr_ref]
opt-level = 3

# The real-time BSDF runs through the same harness.
[profile.dev.package.lighting_math]
opt-level = 3
