[workspace]
members = ["crates/*", "tests/*", "examples"]
exclude = ["probes"]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/pavlov-net/orr"

[workspace.dependencies]
orr = { path = "crates/orr" }
orr-atmosphere = { path = "crates/orr-atmosphere" }
orr-color = { path = "crates/orr-color", version = "0.0.1" }
orr-cook = { path = "crates/orr-cook" }
orr-dlss = { path = "crates/orr-dlss", version = "0.0.1" }
orr-egui = { path = "crates/orr-egui" }
orr-gpu = { path = "crates/orr-gpu" }
orr-io = { path = "crates/orr-io", version = "0.0.1" }
orr-lighting = { path = "crates/orr-lighting" }
orr-math = { path = "crates/orr-math", version = "0.0.1" }
orr-output = { path = "crates/orr-output" }
orr-memory = { path = "crates/orr-memory", version = "0.0.1" }
orr-pack = { path = "crates/orr-pack" }
orr-scene = { path = "crates/orr-scene" }
orr-shaders = { path = "crates/orr-shaders" }
gpu-suite = { path = "tests/gpu-suite" }
openpbr-ref = { path = "tests/openpbr-ref" }
shader-maths = { path = "tests/shader-maths" }
# crates.io ash is stuck on Vulkan 1.3.281; master carries 1.4 headers
# with descriptor heap, cluster acceleration structures and cooperative
# vectors.
ash = { git = "https://github.com/ash-rs/ash", rev = "8844f6b4eefb16d08cd73c8f3d340e1ac12deb16" }
raw-window-handle = "0.6"
thiserror = "2"
log = "0.4"
glam = "0.34"
blake3 = "1"
bitflags = "2"
bytemuck = { version = "1", features = ["derive"] }
# 0.14 is the version ctt uses, so one zstd-sys builds.
zstd = "0.14"
png = "0.18"
serde_json = "1.0.154"
egui = { version = "0.37", default-features = false }
io-uring = "0.7.15"
libc = "0.2"
libloading = "0.9"
windows = "0.62.2"

cc = "1.10"
bindgen = "0.72.1"
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"
cast_lossless = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"

[profile.dev.package."*"]
opt-level = 3

# The spectral reference integrator runs in tests.
[profile.dev.package.orr-atmosphere]
opt-level = 3

# The OpenPBR harness samples millions of directions in tests.
[profile.dev.package.openpbr-ref]
opt-level = 3

# The real-time BSDF runs through the same harness.
[profile.dev.package.lighting-maths]
opt-level = 3
